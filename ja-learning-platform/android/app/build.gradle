apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

kotlin { jvmToolchain(21) }

android {
    namespace = "com.jaleaning.app"
    compileSdk = rootProject.ext.compileSdkVersion

    buildFeatures { buildConfig true }
    testBuildType providers.gradleProperty('testBuildType').getOrElse('debug')
    def releaseUrl = providers.gradleProperty('releaseUrl').get()
    def devUrl = providers.gradleProperty('devUrl').get()
    def emulatorUrl = providers.gradleProperty('emulatorUrl').get()
    if (!(releaseUrl ==~ /https:\/\/[^\s"\\]+/)) throw new GradleException('releaseUrl must be HTTPS')
    if (!(devUrl ==~ /http:\/\/[^\s"\\]+/)) throw new GradleException('devUrl must be HTTP')

    if (!(emulatorUrl ==~ /http:\/\/[^\s"\\]+/)) throw new GradleException('emulatorUrl must be HTTP')

    signingConfigs {
        release {
            storeFile file(providers.environmentVariable('ANDROID_KEYSTORE_FILE').getOrElse('release-key.jks'))
            storePassword providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD').orNull
            keyAlias providers.environmentVariable('ANDROID_KEY_ALIAS').getOrElse('release')
            keyPassword providers.environmentVariable('ANDROID_KEY_PASSWORD').orNull
        }
    }

    defaultConfig {
        applicationId "com.jaleaning.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'String', 'APP_URL', '"' + devUrl + '"'
            buildConfigField 'String', 'EMULATOR_URL', '"' + emulatorUrl + '"'
            manifestPlaceholders = [usesCleartextTraffic: 'true']
        }
        release {
            buildConfigField 'String', 'APP_URL', '"' + releaseUrl + '"'
            buildConfigField 'String', 'EMULATOR_URL', '"' + releaseUrl + '"'
            manifestPlaceholders = [usesCleartextTraffic: 'false']
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.20')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Separate from cap sync: model/runtime assets are native and never served by Render.
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/tts-assets'))
tasks.register('prepareBundledTts', Exec) {
    workingDir "${projectDir}/../.."
    commandLine '/usr/local/bin/node', 'scripts/prepare-tts-model.js', '--android'
    inputs.files(fileTree("${projectDir}/../../src/tts"), file("${projectDir}/../../scripts/prepare-tts-model.js"), file("${projectDir}/../../scripts/tts-model-lock.json"), file("${projectDir}/../../package-lock.json"))
    outputs.dir(layout.buildDirectory.dir('generated/tts-assets'))
}
preBuild.dependsOn prepareBundledTts

// Recreate USB forwarding for physical devices on Android Studio Run as well.
tasks.register('prepareDebugPortForwarding') {
    doLast {
        def endpoint = new URI(providers.gradleProperty('devUrl').get())
        if (!(endpoint.host in ['localhost', '127.0.0.1'])) return
        def adb = new File(android.sdkDirectory, "platform-tools/adb${System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''}")
        def port = endpoint.port == -1 ? 80 : endpoint.port
        try {
            def devices = new ByteArrayOutputStream()
            def listing = project.exec {
                commandLine adb.absolutePath, 'devices'
                standardOutput = devices
                ignoreExitValue = true
            }
            if (listing.exitValue != 0) throw new GradleException('adb devices failed')
            devices.toString('UTF-8').readLines().each { line ->
                def fields = line.trim().split(/\s+/)
                if (fields.length >= 2 && fields[1] == 'device' && !fields[0].startsWith('emulator-')) {
                    def result = project.exec {
                        commandLine adb.absolutePath, '-s', fields[0], 'reverse', "tcp:${port}", "tcp:${port}"
                        ignoreExitValue = true
                    }
                    if (result.exitValue != 0) throw new GradleException("adb reverse failed for ${fields[0]}")
                    logger.lifecycle("Debug USB forwarding ready: ${fields[0]} localhost:${port}")
                }
            }
        } catch (Exception error) {
            logger.warn("USB forwarding unavailable: ${error.message}. Run adb reverse tcp:${port} tcp:${port} after connecting the phone.")
        }
    }
}
tasks.matching { it.name == 'preDebugBuild' }.configureEach { dependsOn 'prepareDebugPortForwarding' }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
