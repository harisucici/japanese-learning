apply plugin: 'com.android.application'

android {
    namespace = "com.jaleaning.app"
    compileSdk = rootProject.ext.compileSdkVersion

    buildFeatures { buildConfig true }
    def releaseUrl = providers.gradleProperty('releaseUrl').getOrElse('https://japanese-learning-92jk.onrender.com')
    def devUrl = providers.gradleProperty('devUrl').getOrElse('http://localhost:8080')
    if (!(releaseUrl ==~ /https:\/\/[^\s"\\]+/)) throw new GradleException('releaseUrl must be HTTPS')
    if (!(devUrl ==~ /http:\/\/[^\s"\\]+/)) throw new GradleException('devUrl must be HTTP')

    signingConfigs {
        release {
            storeFile file(providers.environmentVariable('ANDROID_KEYSTORE_FILE').getOrElse('release-key.jks'))
            storePassword providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD').orNull
            keyAlias providers.environmentVariable('ANDROID_KEY_ALIAS').getOrElse('release')
            keyPassword providers.environmentVariable('ANDROID_KEY_PASSWORD').orNull
        }
    }

    defaultConfig {
        applicationId "com.jaleaning.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'String', 'APP_URL', '"' + devUrl + '"'
            manifestPlaceholders = [usesCleartextTraffic: 'true']
        }
        release {
            buildConfigField 'String', 'APP_URL', '"' + releaseUrl + '"'
            manifestPlaceholders = [usesCleartextTraffic: 'false']
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Separate from cap sync: model/runtime assets are native and never served by Render.
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/tts-assets'))
tasks.register('prepareBundledTts', Exec) {
    workingDir "${projectDir}/../.."
    commandLine 'node', 'scripts/prepare-tts-model.js', '--android'
    inputs.files(fileTree("${projectDir}/../../src/tts"), file("${projectDir}/../../scripts/prepare-tts-model.js"), file("${projectDir}/../../scripts/tts-model-lock.json"), file("${projectDir}/../../package-lock.json"))
    outputs.dir(layout.buildDirectory.dir('generated/tts-assets'))
}
preBuild.dependsOn prepareBundledTts

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
